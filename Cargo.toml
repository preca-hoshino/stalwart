[workspace]
resolver = "2"
members = [
    "crates/main",
    "crates/types",
    "crates/http",
    "crates/http-proto",
    "crates/jmap",
    "crates/jmap-proto",
    "crates/email",
    "crates/imap",
    "crates/imap-proto",
    "crates/smtp",
    "crates/managesieve",
    "crates/pop3",
    "crates/dav-proto",
    "crates/dav",
    "crates/groupware",
    "crates/spam-filter",
    "crates/nlp",
    "crates/store",
    "crates/coordinator",
    "crates/directory",
    "crates/registry",
    "crates/services",
    "crates/utils",
    "crates/common",
    "crates/trc",
    "crates/migration",
    "tests",
]

[workspace.package]
edition = "2024"

[profile.dev]
opt-level = 0
debug = 1
#codegen-units = 4
lto = false
incremental = true
panic = 'unwind'
debug-assertions = true
overflow-checks = false
rpath = false

[profile.release]
opt-level = 3            # 最高级别优化，优先运行速度
debug = false
codegen-units = 1        # 单编译单元: 最大化跨模块内联与优化，代价是编译慢且无法并行
lto = true               # Fat LTO: 全程序链接时优化，跨 crate 全局内联，代价是链接极慢
incremental = false
panic = 'abort'          # 直接 abort: 去除 unwind 表，二进制更小，运行时零开销
debug-assertions = false
overflow-checks = false
rpath = false
strip = true             # 去除符号表和调试信息

[profile.test]
opt-level = 0
debug = 1
#codegen-units = 16
lto = false
incremental = true
debug-assertions = true
overflow-checks = true
rpath = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = true
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false
